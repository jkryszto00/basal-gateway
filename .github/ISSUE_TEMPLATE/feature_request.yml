name: Feature request
description: An idea or a missing feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Alternatives you considered are welcome too.
